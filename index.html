<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>html{box-sizing:border-box;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>たびしおり</title>
<style id="tabi-css">/* レイアウト：1画面のアプリ。上に旅の名前と「何日目」のチップ、中央に日程（路線図のような縦の線と駅の丸）、下にタブ。
   広い画面ではタブが上に移り、予定の詳細は右のパネルになる。色は紺を基調に、予定の種類ごとに路線の色を割り当てる。 */
:root {
  --bg: #f1f3f8;
  --surface: #ffffff;
  --surface-2: #e7ebf2;
  --field: #f5f7fa;
  --ink: #161d2b;
  --ink-2: #4b586f;
  --ink-3: #7c889e;
  --line: #d4dae5;
  --brand: #1c3a74;
  --brand-ink: #ffffff;
  --brand-soft: #dde6f7;
  --now: #d43f27;
  --c-move: #2460c4;
  --c-food: #c2570f;
  --c-stay: #7044b6;
  --c-spot: #157a55;
  --c-other: #5a667c;
  --on-c: #ffffff;
  --warn: #9a4a05;
  --warn-bg: #fcefd8;
  --warn-line: #efc88a;
  --ok: #157a55;
  --danger: #c0321f;
  --scrim: rgba(10, 16, 28, .46);
  --shadow: 0 1px 2px rgba(18, 28, 48, .07), 0 8px 24px rgba(18, 28, 48, .10);
  --font: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
  --num: "DIN Alternate", "Avenir Next", "Helvetica Neue", "Roboto", "Hiragino Sans", sans-serif;
  --r: 12px;
  --hour: 56px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e121a; --surface: #181e2b; --surface-2: #242c3d; --field: #111622;
    --ink: #e9edf5; --ink-2: #aab4c8; --ink-3: #78849b; --line: #2c3548;
    --brand: #9cb9f8; --brand-ink: #0c1526; --brand-soft: #212f4c;
    --now: #ff735c;
    --c-move: #6fa1f6; --c-food: #f0985b; --c-stay: #b297ef; --c-spot: #55c698; --c-other: #9ba7bc;
    --on-c: #0d1422;
    --warn: #f3b860; --warn-bg: #372a11; --warn-line: #6b5120;
    --ok: #55c698; --danger: #ff8573;
    --scrim: rgba(0, 0, 0, .6);
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e121a; --surface: #181e2b; --surface-2: #242c3d; --field: #111622;
  --ink: #e9edf5; --ink-2: #aab4c8; --ink-3: #78849b; --line: #2c3548;
  --brand: #9cb9f8; --brand-ink: #0c1526; --brand-soft: #212f4c;
  --now: #ff735c;
  --c-move: #6fa1f6; --c-food: #f0985b; --c-stay: #b297ef; --c-spot: #55c698; --c-other: #9ba7bc;
  --on-c: #0d1422;
  --warn: #f3b860; --warn-bg: #372a11; --warn-line: #6b5120;
  --ok: #55c698; --danger: #ff8573;
  --scrim: rgba(0, 0, 0, .6);
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .45);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { height: 100%; box-sizing: border-box; -webkit-text-size-adjust: 100%; }
body {
  height: 100%; margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.55 var(--font); overflow: hidden; overscroll-behavior: none;
  -webkit-tap-highlight-color: transparent;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--brand); }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.ic { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.num { font-family: var(--num); font-variant-numeric: tabular-nums; }
.cat-move { --c: var(--c-move); } .cat-food { --c: var(--c-food); } .cat-stay { --c: var(--c-stay); }
.cat-spot { --c: var(--c-spot); } .cat-other { --c: var(--c-other); }

/* ---------- 全体の枠 ---------- */
.app { height: 100%; display: flex; flex-direction: column; min-width: 0; }
.hdr { flex: none; background: var(--surface); border-bottom: 1px solid var(--line); z-index: 5; }
.hdr-top { display: flex; align-items: center; gap: 6px; padding: 8px 8px 6px 16px; min-height: 56px; }
.trip-btn {
  flex: 1 1 auto; min-width: 0; display: grid; text-align: left; background: none; border: 0; padding: 4px 6px 4px 0; border-radius: 10px;
}
.trip-name { font-weight: 700; font-size: 18px; line-height: 1.25; display: flex; align-items: center; gap: 4px; min-width: 0; }
.trip-name span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.trip-name .ic { width: 16px; height: 16px; color: var(--ink-3); }
.trip-meta { font-size: 12px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hdr-actions { flex: none; display: flex; align-items: center; gap: 2px; }
.icon-btn {
  width: 40px; height: 40px; border: 0; background: none; border-radius: 10px; display: grid; place-items: center; color: var(--ink-2); flex: none;
}
.icon-btn:hover { background: var(--surface-2); }
.icon-btn:disabled { opacity: .35; cursor: default; background: none; }
.mode {
  display: inline-flex; align-items: center; gap: 5px; height: 36px; padding: 0 12px 0 10px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--surface); font-size: 13px; font-weight: 700; color: var(--ink-2); white-space: nowrap;
}
.mode .ic { width: 16px; height: 16px; }
.mode[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }

.chips { display: flex; gap: 6px; overflow-x: auto; padding: 2px 16px 10px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; min-height: 34px;
  font-size: 13px; color: var(--ink-2); display: inline-flex; align-items: baseline; gap: 6px; white-space: nowrap;
}
.chip b { font-weight: 700; color: var(--ink); }
.chip.hol i, .chip.sun i { color: var(--now); }
.chip.sat i { color: var(--c-move); }
.chip i { font-style: normal; }
.chip[aria-current="true"] { background: var(--brand-soft); border-color: var(--brand); }
.chip[aria-current="true"] b { color: var(--brand); }

.tabs { display: flex; }
.tab {
  flex: 1; border: 0; background: none; display: grid; justify-items: center; gap: 1px; padding: 7px 4px 6px; font-size: 11px; font-weight: 700;
  color: var(--ink-3); min-height: 52px; white-space: nowrap;
}
.tab .ic { width: 22px; height: 22px; }
.tab[aria-current="page"] { color: var(--brand); }
.tabs-bottom {
  flex: none; background: var(--surface); border-top: 1px solid var(--line); z-index: 5;
}
.tabs-top { display: none; }

.banner {
  flex: none; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 16px; font-size: 13px;
  background: var(--warn-bg); color: var(--warn); border-bottom: 1px solid var(--warn-line);
}
.banner p { margin: 0; flex: 1 1 200px; min-width: 0; }
.banner .btn { min-height: 34px; padding: 4px 12px; font-size: 13px; }

.main { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; position: relative; outline: none; }
.main[data-tab="grid"] { overflow: auto; }
.wrap { max-width: 760px; margin: 0 auto; padding: 0 16px 96px; }

.fab {
  position: fixed; right: 16px; bottom: calc(68px + env(safe-area-inset-bottom, 0px)); z-index: 6;
  height: 52px; padding: 0 20px 0 16px; border: 0; border-radius: 999px; background: var(--brand); color: var(--brand-ink);
  font-weight: 700; font-size: 15px; display: inline-flex; align-items: center; gap: 6px; box-shadow: var(--shadow);
}
.fab .ic { width: 22px; height: 22px; stroke-width: 2.2; }

/* ---------- 日程（リスト）---------- */
.next {
  margin: 14px 0 2px; padding: 12px 14px; border-radius: var(--r); background: var(--brand); color: var(--brand-ink);
  display: grid; gap: 2px; border: 0; width: 100%; text-align: left;
}
.next small { font-size: 12px; opacity: .85; font-weight: 700; letter-spacing: .04em; }
.next strong { font-size: 17px; line-height: 1.35; }
.next span { font-size: 13px; opacity: .9; }

.day { padding-bottom: 6px; }
.day-h {
  position: sticky; top: 0; z-index: 2; background: var(--bg); padding: 14px 0 6px;
  display: grid; grid-template-columns: auto auto minmax(0, 1fr) auto; align-items: center; column-gap: 10px;
}
.day-n { font-weight: 700; font-size: 12px; color: var(--brand-ink); background: var(--brand); border-radius: 6px; padding: 2px 8px; letter-spacing: .04em; }
.day-d { font-weight: 700; font-size: 18px; white-space: nowrap; }
.day-d.sun, .day-d.hol { color: var(--now); }
.day-d.sat { color: var(--c-move); }
.day-hol { font-size: 12px; color: var(--now); font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.day-t {
  grid-column: 1 / 4; grid-row: 2; min-width: 0; font-size: 13px; color: var(--ink-2); background: none; border: 0; padding: 3px 0 0; text-align: left;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-height: 24px;
}
span.day-t:empty { display: none; }
button.day-t:hover { color: var(--brand); }
.day-t.empty { color: var(--ink-3); }
.day-add { grid-column: 4; grid-row: 1 / span 2; }

.tl { list-style: none; margin: 0; padding: 0; }
.ev, .gap { display: grid; grid-template-columns: 46px 30px minmax(0, 1fr); column-gap: 6px; position: relative; }
.ev-time { text-align: right; padding-top: 13px; line-height: 1.15; }
.ev-time b { display: block; font-size: 17px; font-weight: 600; letter-spacing: .01em; }
.ev-time span { display: block; font-size: 12px; color: var(--ink-3); }
.ev-time .none { font-size: 11px; color: var(--ink-3); font-family: var(--font); padding-top: 4px; }
.rail { position: relative; display: flex; justify-content: center; }
.rail::before { content: ""; position: absolute; top: 0; bottom: 0; width: 3px; border-radius: 2px; background: var(--line); }
.ev:first-child .rail::before { top: 14px; }
.ev:last-child .rail::before { bottom: calc(100% - 30px); }
.dot {
  position: relative; margin-top: 9px; width: 30px; height: 30px; border-radius: 50%; background: var(--c); color: var(--on-c);
  display: grid; place-items: center; box-shadow: 0 0 0 3px var(--bg);
}
.dot .ic { width: 17px; height: 17px; }
.ev-card {
  display: block; width: 100%; text-align: left; margin: 4px 0; padding: 10px 12px; border-radius: var(--r);
  background: var(--surface); border: 1px solid var(--line); min-height: 48px;
}
.ev-card:hover { border-color: var(--c); }
.cat-move > .ev-card { background: color-mix(in srgb, var(--c) 8%, var(--bg)); border-color: transparent; }
.ev-title { font-weight: 700; font-size: 15.5px; line-height: 1.4; overflow-wrap: anywhere; }
.ev-sub { font-size: 13px; color: var(--ink-2); overflow-wrap: anywhere; margin-top: 1px; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
.ev-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
.ev-tags:empty { display: none; }
.tag {
  display: inline-flex; align-items: center; gap: 3px; font-size: 11.5px; font-weight: 700; line-height: 1; padding: 4px 8px; border-radius: 999px;
  background: var(--surface-2); color: var(--ink-2); white-space: nowrap;
}
.tag .ic { width: 12px; height: 12px; stroke-width: 2.2; }
.tag.warn { background: var(--warn-bg); color: var(--warn); }
.tag.done { background: color-mix(in srgb, var(--ok) 14%, var(--surface)); color: var(--ok); }
.tag.now { background: var(--now); color: var(--on-c); }
.ev.is-past > .ev-time, .ev.is-past > .ev-card { opacity: .55; }
.ev.is-now > .ev-card { border-color: var(--now); box-shadow: 0 0 0 1px var(--now); }
.ev-more { display: none; }

.gap { min-height: 22px; align-items: center; }
.gap-t { font-size: 12px; color: var(--ink-3); display: flex; align-items: center; gap: 8px; padding: 1px 2px; }
.gap-t.over { color: var(--danger); font-weight: 700; }
.gap-add {
  border: 1px dashed var(--line); background: none; border-radius: 999px; height: 26px; padding: 0 10px 0 6px; font-size: 12px; color: var(--ink-2);
  display: inline-flex; align-items: center; gap: 2px;
}
.gap-add .ic { width: 14px; height: 14px; }
.gap-add:hover { border-color: var(--brand); color: var(--brand); }
.empty-day {
  border: 1px dashed var(--line); border-radius: var(--r); padding: 18px 14px; color: var(--ink-3); font-size: 14px;
  display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
}
.list-foot { display: flex; gap: 8px; flex-wrap: wrap; padding: 18px 0 0; }

/* ---------- 時間割 ---------- */
.grid-tools { position: sticky; left: 0; display: flex; align-items: center; gap: 8px; padding: 8px 16px 6px; font-size: 12px; color: var(--ink-3); }
.grid-tools p { margin: 0; flex: 1; min-width: 0; }
.grid {
  --colw: calc((100vw - 60px) / 2.15);
  display: grid; grid-template-columns: 44px repeat(var(--n), minmax(var(--colw), 1fr)); min-width: min-content; padding-bottom: 96px;
}
.g-corner, .g-dayh { position: sticky; top: 0; z-index: 3; background: var(--bg); border-bottom: 1px solid var(--line); }
.g-corner { left: 0; z-index: 4; }
.g-dayh { padding: 6px 8px 7px; border-left: 1px solid var(--line); display: grid; gap: 0; line-height: 1.3; min-width: 0; }
.g-dayh b { font-size: 11px; color: var(--brand); letter-spacing: .04em; }
.g-dayh span { font-size: 15px; font-weight: 700; }
.g-dayh.sun span, .g-dayh.hol span { color: var(--now); }
.g-dayh.sat span { color: var(--c-move); }
.g-dayh small { font-size: 10.5px; color: var(--now); font-weight: 700; min-height: 0; }
.g-dayh.today { background: var(--brand-soft); }
.g-allc, .g-all { background: var(--bg); border-bottom: 1px solid var(--line); min-height: 8px; }
.g-allc { position: sticky; left: 0; z-index: 2; font-size: 10px; color: var(--ink-3); text-align: right; padding: 5px 5px 0 0; }
.g-all { border-left: 1px solid var(--line); padding: 3px; display: grid; gap: 3px; align-content: start; }
.g-chip {
  border: 0; border-left: 3px solid var(--c); border-radius: 6px; background: color-mix(in srgb, var(--c) 16%, var(--surface));
  font-size: 12px; font-weight: 700; text-align: left; padding: 3px 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0;
}
.g-axis { position: sticky; left: 0; z-index: 2; background: var(--bg); height: calc(var(--rows) * var(--hour)); }
.g-axis span { position: absolute; right: 6px; transform: translateY(-50%); font-size: 11px; color: var(--ink-3); }
.g-col {
  position: relative; height: calc(var(--rows) * var(--hour));
  border-left: 1px solid var(--line);
  background-image: linear-gradient(to bottom, var(--line) 0, var(--line) 1px, transparent 1px);
  background-size: 100% var(--hour);
}
.g-ev {
  position: absolute; border-radius: 7px; padding: 2px 5px 2px 6px; overflow: hidden; text-align: left;
  background: color-mix(in srgb, var(--c) 17%, var(--surface)); border: 0; border-left: 3px solid var(--c);
  font-size: 12px; line-height: 1.3; color: var(--ink); user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  display: flex; flex-direction: column; justify-content: flex-start; align-items: stretch; box-shadow: 0 0 0 1px var(--bg);
}
.g-ev b { font-weight: 700; overflow-wrap: anywhere; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: var(--lines, 1); overflow: hidden; flex: none; }
.g-ev span { display: block; font-size: 11px; color: var(--ink-2); white-space: nowrap; flex: none; }
.g-ev.short span { display: none; }
@keyframes flash { 0% { box-shadow: 0 0 0 0 var(--brand); } 25% { box-shadow: 0 0 0 5px var(--brand-soft); } 100% { box-shadow: 0 0 0 0 transparent; } }
.ev.flash > .ev-card, .g-ev.flash { animation: flash 1.4s ease-out; }
.g-ev.tent { border-left-style: dashed; }
.g-ev.warn b { padding-right: 15px; }
.g-ev.warn::after { content: "!"; position: absolute; top: 2px; right: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--warn); color: var(--surface); font-size: 10px; font-weight: 700; display: grid; place-items: center; }
.g-ev.dragging { z-index: 10; box-shadow: var(--shadow); opacity: .94; outline: 2px solid var(--c); cursor: grabbing; }
.g-grip { position: absolute; left: 0; right: 0; bottom: 0; height: 12px; cursor: ns-resize; touch-action: none; }
.g-grip::after { content: ""; position: absolute; left: 50%; bottom: 2px; width: 22px; height: 3px; margin-left: -11px; border-radius: 2px; background: var(--c); opacity: .55; }
.app[data-edit="0"] .g-grip { display: none; }
.g-now { position: absolute; left: 0; right: 0; height: 0; border-top: 2px solid var(--now); z-index: 5; pointer-events: none; }
.g-now::before { content: ""; position: absolute; left: -4px; top: -5px; width: 8px; height: 8px; border-radius: 50%; background: var(--now); }
.g-tip {
  position: fixed; z-index: 30; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 13px; font-weight: 700;
  padding: 4px 9px; border-radius: 8px; transform: translate(-50%, -140%); white-space: nowrap;
}

/* ---------- まとめ ---------- */
.sum { display: grid; gap: 22px; padding-top: 16px; }
.sum h2 { font-size: 15px; margin: 0 0 8px; display: flex; align-items: center; gap: 8px; }
.sum h2 small { font-weight: 400; color: var(--ink-3); font-size: 12px; }
.sum-note { white-space: pre-wrap; color: var(--ink-2); font-size: 14px; margin: 0; overflow-wrap: anywhere; }
.rows { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.rows > li { border-top: 1px solid var(--line); }
.rows > li:first-child { border-top: 0; }
.row {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 10px; width: 100%; text-align: left;
  background: none; border: 0; padding: 10px 12px; min-height: 48px;
}
button.row:hover { background: var(--field); }
.row .dot { margin: 0; width: 26px; height: 26px; box-shadow: none; }
.row .dot .ic { width: 15px; height: 15px; }
.row-t { font-weight: 700; font-size: 14.5px; overflow-wrap: anywhere; }
.row-s { font-size: 12.5px; color: var(--ink-2); overflow-wrap: anywhere; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
.row-r { font-size: 13px; color: var(--ink-2); white-space: nowrap; }
.row.warn-row .row-s { color: var(--warn); }
.todo-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 4px; padding: 2px 4px 2px 12px; min-height: 48px; }
.todo-row label { display: contents; }
.todo-row input[type="checkbox"] { width: 22px; height: 22px; accent-color: var(--brand); margin: 0 6px 0 0; }
.todo-row span { font-size: 14.5px; overflow-wrap: anywhere; padding: 8px 0; }
.todo-row input:checked ~ span { color: var(--ink-3); text-decoration: line-through; }
.todo-add { display: flex; gap: 8px; margin-top: 8px; }
.todo-add input { flex: 1; min-width: 0; }
.cost-bar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--surface-2); margin: 8px 0 6px; }
.cost-bar i { background: var(--c); min-width: 2px; }
.cost-leg { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--ink-2); }
.cost-leg span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--c); margin-right: 5px; }
.big { font-family: var(--num); font-size: 26px; font-weight: 600; }
.muted { color: var(--ink-3); font-size: 13.5px; margin: 0; }

/* ---------- ボタン・入力 ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 8px 16px; border-radius: 11px;
  border: 1px solid var(--line); background: var(--surface); font-weight: 700; font-size: 14.5px; color: var(--ink); text-decoration: none;
  white-space: nowrap;
}
.btn:hover { border-color: var(--ink-3); }
.btn .ic { width: 18px; height: 18px; }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.btn.danger { color: var(--danger); }
.btn.small { min-height: 36px; padding: 4px 12px; font-size: 13px; border-radius: 9px; }
.btn.grow { flex: 1 1 0; }
.btn:disabled { opacity: .45; cursor: default; }
.field { display: grid; gap: 4px; margin-top: 12px; min-width: 0; }

      if (saved && Array.isArray(saved.trips)) { D.trips = saved.trips.map(C.normTrip); D.removed = saved.removed || {}; }
      if (emb) C.mergeEmbedded(D, emb);
    }
    D.cur = saved && saved.cur;
    if (!trip()) D.cur = pickDefaultTrip();
    try { var ui = JSON.parse(sessionStorage.getItem(SS_KEY) || 'null'); if (ui) { if (ui.tab) UI.tab = ui.tab; if (ui.cur) { var keep = D.cur; D.cur = ui.cur; if (!trip()) D.cur = keep; } UI.restoreTop = ui.top || 0; } } catch (e) { /* なくてよい */ }
  }
  function applyDraft() {
    var d = Host.draft;
    Host.draft = null;
    if (!d) return;
    var trips = d.draft.map(C.normTrip);
    if (JSON.stringify(trips) === Host.publishedJson) return;
    D.trips = trips;
    Host.stale = d.base !== Host.baseHash;
    if (d.cur) { var keep = D.cur; D.cur = d.cur; if (!trip()) D.cur = keep; }
    if (!trip()) D.cur = pickDefaultTrip();
  }
  function persist() {
    var o = { prefs: D.prefs, cur: D.cur };
    if (Host.artifact) { if (Host.canEdit && isDirty()) { o.draft = D.trips; o.base = Host.stale ? '' : Host.baseHash; } }
    else { o.trips = D.trips; o.removed = D.removed; }
    try { localStorage.setItem(LS_KEY, JSON.stringify(o)); } catch (e) { /* 保存できない環境でも表示は続ける */ }
  }
  function stashUI() {
    try { sessionStorage.setItem(SS_KEY, JSON.stringify({ tab: UI.tab, cur: D.cur, top: mainEl ? mainEl.scrollTop : 0 })); } catch (e) { /* なくてよい */ }
  }

  // ---------- 変更・元に戻す ----------
  function snapshot() { return JSON.stringify({ trips: D.trips, cur: D.cur, removed: D.removed }); }
  function restore(s) { var o = JSON.parse(s); D.trips = o.trips; D.cur = o.cur; D.removed = o.removed || {}; }
  function commit(msg, fn) {
    var before = snapshot();
    if (fn() === false) return false;
    var t = trip();
    if (t) { var stamp = new Date().toISOString(); t.updatedAt = stamp > t.updatedAt ? stamp : new Date(Date.parse(t.updatedAt) + 1).toISOString(); }
    UI.undo.push(before);
    if (UI.undo.length > 60) UI.undo.shift();
    UI.redo = [];
    persist();
    render();
    if (msg) toast(msg, '元に戻す', undo);
    return true;
  }
  function undo() {
    if (!UI.undo.length) return;
    UI.redo.push(snapshot());
    restore(UI.undo.pop());
    afterHistory('元に戻しました');
  }
  function redo() {
    if (!UI.redo.length) return;
    UI.undo.push(snapshot());
    restore(UI.redo.pop());
    afterHistory('やり直しました');
  }
  function afterHistory(msg) {
    if (!trip()) D.cur = pickDefaultTrip();
    UI.sheets = [];
    persist();
    render();
    toast(msg);
  }

  // ---------- 旅行の状態 ----------
  function phase(t) {
    var today = C.isoDate(now());
    if (today < t.startDate) return { k: 'before', days: C.diffDays(today, t.startDate) };
    if (today > t.endDate) return { k: 'after' };
    return { k: 'during', day: C.diffDays(t.startDate, today) + 1 };
  }
  function rangeLabel(t) {
    if (t.endDate === t.startDate) return C.shortDate(t.startDate);
    var a = C.parseDate(t.startDate), b = C.parseDate(t.endDate);
    // 同じ月なら、帰る日は「日(曜)」だけにして短くする
    return C.shortDate(t.startDate) + '〜' + (a.getMonth() === b.getMonth() && a.getFullYear() === b.getFullYear() ? b.getDate() + '(' + C.DOW[b.getDay()] + ')' : C.shortDate(t.endDate));
  }
  function dayClass(date) {
    var w = C.dow(date);
    return (C.holidayName(date) ? ' hol' : '') + (w === 0 ? ' sun' : '') + (w === 6 ? ' sat' : '');
  }
  function orderedEvents(t) {
    var days = {};
    t.events.forEach(function (e) { days[e.date] = true; });
    var out = [];
    Object.keys(days).sort().forEach(function (d) { out = out.concat(C.eventsOn(t, d)); });
    return out;
  }

  // ---------- 枠 ----------
  function buildShell() {
    doc.documentElement.lang = 'ja';
    app = doc.getElementById('app');
    app.className = 'app';
    app.innerHTML =
      '<header class="hdr"><div class="hdr-top">' +
        '<button type="button" class="trip-btn" data-act="trips" id="trip-btn"></button>' +
        '<nav class="tabs tabs-top" aria-label="表示の切り替え"></nav>' +
        '<div class="hdr-actions" id="hdr-actions"></div>' +
      '</div><div class="chips" id="chips"></div></header>' +
      '<div class="banner" id="banner" hidden></div>' +
      '<main class="main" id="main" tabindex="-1"></main>' +
      '<button type="button" class="fab" id="fab" data-act="add">' + ic('plus') + '予定</button>' +
      '<nav class="tabs tabs-bottom" aria-label="表示の切り替え"></nav>' +
      '<div class="scrim" id="scrim" hidden></div>' +
      '<aside class="sheet" id="sheet" role="dialog" aria-modal="true" tabindex="-1" hidden></aside>' +
      '<div class="toasts" id="toasts" aria-live="polite"></div>';
    mainEl = $('#main'); sheetEl = $('#sheet'); scrimEl = $('#scrim'); toastsEl = $('#toasts');
  }

  function render() {
    renderHeader();
    renderBanner();
    renderMain();
    var top = UI.sheets[UI.sheets.length - 1];
    if (top && !INPUT_SHEETS[top.type]) drawSheet(false);
  }

  function renderHeader() {
    var t = trip();
    app.dataset.tab = UI.tab;
    app.dataset.edit = canEdit() ? '1' : '0';
    var meta = '';
    if (t) {
      var ph = phase(t);
      meta = (ph.k === 'during' ? '旅行中（' + ph.day + '日目）・' : '') + esc(rangeLabel(t)) + '<span class="wide-only">・' + C.nightsLabel(t) + '</span>' + (ph.k === 'before' ? '・あと' + ph.days + '日' : '');
    }
    $('#trip-btn').innerHTML = '<span class="trip-name"><span>' + esc(t ? t.title : APP_TITLE) + '</span>' + ic('down') + '</span>' +
      '<span class="trip-meta">' + (t ? meta : '旅行をえらぶ・つくる') + '</span>';
    $('#trip-btn').setAttribute('aria-label', (t ? t.title : APP_TITLE) + '（旅行の一覧をひらく）');

    var a = '';
    if (canEdit()) {
      a += '<button type="button" class="icon-btn" data-act="undo" aria-label="元に戻す" title="元に戻す"' + (UI.undo.length ? '' : ' disabled') + '>' + ic('undo') + '</button>';
      a += '<button type="button" class="icon-btn" id="redo-btn" data-act="redo" aria-label="やり直す" title="やり直す"' + (UI.redo.length ? '' : ' hidden') + '>' + ic('redo') + '</button>';
    }
    if (Host.canEdit && t) {
      a += '<button type="button" class="mode" data-act="mode" aria-pressed="' + (D.prefs.edit ? 'true' : 'false') + '" title="' + (D.prefs.edit ? '編集できます。押すと「見るだけ」に切り替え' : '見るだけの表示です。押すと編集できます') + '">' +
        ic(D.prefs.edit ? 'edit' : 'eye') + '<b>' + (D.prefs.edit ? '編集中' : '見るだけ') + '</b></button>';
    }
    a += '<button type="button" class="icon-btn" data-act="menu" aria-label="メニュー" title="メニュー">' + ic('more') + '</button>';
    $('#hdr-actions').innerHTML = a;

    var tabs = [['list', '日程'], ['grid', '時間割'], ['sum', 'まとめ']].map(function (x) {
      return '<button type="button" class="tab" data-act="tab" data-tab="' + x[0] + '"' + (UI.tab === x[0] ? ' aria-current="page"' : '') + '>' + ic(x[0]) + '<span>' + x[1] + '</span></button>';
    }).join('');
    $$('.tabs').forEach(function (n) { n.innerHTML = tabs; n.hidden = !t; });

    var chips = '';
    if (t && UI.tab !== 'sum') {
      C.tripDays(t).forEach(function (date, i) {
        var d = C.parseDate(date);
        chips += '<button type="button" class="chip' + dayClass(date) + '" data-act="jump" data-date="' + date + '"><b>' + (i + 1) + '日目</b><i class="num">' + (d.getMonth() + 1) + '/' + d.getDate() + ' ' + C.DOW[d.getDay()] + '</i></button>';
      });
    }
    var chipsEl = $('#chips');
    chipsEl.innerHTML = chips;
    chipsEl.hidden = !chips;
    $('#fab').hidden = !(canEdit() && t && UI.tab !== 'sum');
    doc.title = t ? t.title + '｜' + APP_TITLE : APP_TITLE;
  }

  function renderBanner() {
    var b = $('#banner'), html = '';
    if (Host.artifact && Host.canEdit && isDirty()) {
      html = '<p>' + (Host.stale ? 'ほかの端末で新しい版が保存されています。この端末には、まだ保存していない変更があります。' : 'この端末だけの変更があります。保存すると、見ている人みんなに反映されます。') + '</p>' +
        '<button type="button" class="btn small primary" data-act="publish"' + (Host.busy ? ' disabled' : '') + '>' + (Host.busy ? '保存中…' : (Host.stale ? 'この内容で上書き保存' : 'みんなに反映する')) + '</button>' +
        '<button type="button" class="btn small" data-act="discard"' + (Host.busy ? ' disabled' : '') + '>変更を捨てる</button>';
    }
    b.innerHTML = html;
    b.hidden = !html;
  }

  function renderMain() {
    var t = trip(), keepTop = mainEl.scrollTop, keepLeft = mainEl.scrollLeft, same = mainEl.dataset.tab === UI.tab && mainEl.dataset.trip === (t ? t.id : '');
    mainEl.dataset.tab = UI.tab;
    mainEl.dataset.trip = t ? t.id : '';
    if (!t) {
      mainEl.innerHTML = '<div class="wrap"><div class="sum"><div><h2>旅行がまだありません</h2><p class="muted">旅行をつくると、日ごとの予定を並べて、予約や持ち物もまとめて見られます。</p>' +
        (Host.canEdit ? '<div class="list-foot"><button type="button" class="btn primary" data-act="trip-new">' + ic('plus') + '新しい旅行をつくる</button></div>' : '') + '</div></div></div>';
      return;
    }
    mainEl.innerHTML = UI.tab === 'grid' ? gridHTML(t) : UI.tab === 'sum' ? sumHTML(t) : listHTML(t);
    if (same) { mainEl.scrollTop = keepTop; mainEl.scrollLeft = keepLeft; }
    else if (UI.restoreTop) { mainEl.scrollTop = UI.restoreTop; UI.restoreTop = 0; }
    else initialScroll(t);
    if (UI.flash) {
      var el = $('[data-id="' + UI.flash + '"]', mainEl);
      UI.flash = '';
      if (el) { el.scrollIntoView({ block: 'center', inline: 'center' }); el.classList.add('flash'); }
    }
    spy();
  }

  function initialScroll(t) {
    var today = C.isoDate(now());
    if (UI.tab === 'list') {
      var sec = $('.day[data-date="' + today + '"]', mainEl);
      mainEl.scrollTop = sec ? sec.offsetTop : 0;
      var cur = sec && ($('.ev.is-now', sec) || $('.ev:not(.is-past)', sec));
      if (cur) mainEl.scrollTop = Math.max(sec.offsetTop, cur.offsetTop - 120);
    } else if (UI.tab === 'grid') {
      var first = null;
      t.events.forEach(function (e) { var s = C.toMin(e.start); if (s != null && (first == null || s < first)) first = s; });
      mainEl.scrollTop = first == null ? 0 : Math.max(0, (first - G.lo * 60) * G.H / 60 - 12);
      var col = $('.g-col[data-date="' + today + '"]', mainEl);
      mainEl.scrollLeft = col ? col.offsetLeft - 44 : 0;
    } else mainEl.scrollTop = 0;
  }

  // ---------- 日程（リスト）----------
  function subText(ev) {
    var p = [];
    if (ev.cat === 'move') {
      if (ev.line) p.push(ev.line);
      else if ((ev.from || ev.to) && !(ev.title.indexOf(ev.from) >= 0 && ev.title.indexOf(ev.to) >= 0)) p.push((ev.from || '？') + ' → ' + (ev.to || '？'));
      var d = C.duration(ev);
      if (d) p.push(C.fmtDur(d));
    } else if (ev.places.length === 1) {
      var pl = ev.places[0];
      var bare = pl.name.replace(/[（(].*$/, '').trim();
      if (pl.name && ev.title.indexOf(bare) < 0) p.push(pl.name);
      else if (pl.hours) p.push(pl.hours);
      else if (pl.address) p.push(pl.address.replace(/^〒\s*[\d-]+\s*/, ''));
    } else if (ev.places.length > 1) {
      p.push('候補 ' + ev.places.length + 'か所：' + ev.places.map(function (x) { return x.name.replace(/[（(].*$/, '').trim(); }).filter(Boolean).join(' ／ '));
    }
    return p.join('・');
  }
  function tagsHTML(ev, isNow) {
    var h = '';
    if (isNow) h += '<span class="tag now">いま</span>';
    if (ev.warn) h += '<span class="tag warn">' + ic('warn') + '要確認</span>';
    if (ev.tentative) h += '<span class="tag">仮</span>';
    if (ev.reserve === 'todo') h += '<span class="tag">' + ic('ticket') + '未予約</span>';
    if (ev.reserve === 'done') h += '<span class="tag done">' + ic('check') + '予約済み</span>';
    if (ev.cost !== '') h += '<span class="tag num">' + C.yen(ev.cost) + '</span>';
    return h;
  }
  function printText(ev) {
    var L = [];
    if ((ev.from || ev.to) && !(ev.title.indexOf(ev.from) >= 0 && ev.title.indexOf(ev.to) >= 0)) L.push((ev.from || '？') + ' → ' + (ev.to || '？'));
    if (ev.seat) L.push('座席・のりば：' + ev.seat);
    ev.places.forEach(function (p) { L.push([p.name, p.address, p.tel, p.hours].filter(Boolean).join('　')); });
    if (ev.reserveNo) L.push('予約番号：' + ev.reserveNo);
    if (ev.warn) L.push('※ ' + ev.warn);
    if (ev.note) L.push(ev.note);
    return L.join('\n');
  }
  function evHTML(ev, nowMin, pastDay) {
    var s = C.toMin(ev.start), e = C.endMin(ev), state = '';
    if (pastDay) state = ' is-past';
    else if (nowMin != null && s != null) {
      if ((e != null ? e : s + 30) <= nowMin) state = ' is-past';
      else if (s <= nowMin) state = ' is-now';
    }
    var time = ev.allDay ? '<span class="none">終日</span>'
      : ev.start ? '<b class="num">' + ev.start + '</b>' + (ev.end ? '<span class="num">' + ev.end + '</span>' : '')
        : '<span class="none">時刻<br>未定</span>';
    var sub = subText(ev);
    return '<li class="ev cat-' + ev.cat + state + '" data-id="' + ev.id + '">' +
      '<div class="ev-time">' + time + '</div>' +
      '<div class="rail"><span class="dot">' + ic(evIcon(ev)) + '</span></div>' +
      '<button type="button" class="ev-card" data-act="open" data-id="' + ev.id + '">' +
        '<div class="ev-title">' + esc(ev.title) + '</div>' +
        (sub ? '<div class="ev-sub">' + esc(sub) + '</div>' : '') +
        '<div class="ev-tags">' + tagsHTML(ev, state === ' is-now') + '</div>' +
        '<div class="ev-more">' + esc(printText(ev)) + '</div>' +
      '</button></li>';
  }
  function gapHTML(a, b, date) {
    var g = C.gapBetween(a, b), text = '', cls = '';
    if (g == null) return '';
    if (g < 0) { text = C.fmtDur(-g) + ' 重なっています'; cls = ' over'; }
    else if (g > 0) text = a.cat === 'move' && b.cat === 'move' ? '乗り換え ' + C.fmtDur(g) : 'あき ' + C.fmtDur(g);
    var add = canEdit() && g >= 15 ? '<button type="button" class="gap-add" data-act="add" data-date="' + date + '" data-start="' + C.fromMin(C.endMin(a)) + '" data-end="' + b.start + '">' + ic('plus') + '入れる</button>' : '';
    if (!text && !add) return '';
    return '<li class="gap"><div></div><div class="rail"></div><div class="gap-t' + cls + '">' + (g < 0 ? ic('warn') : '') + '<span>' + text + '</span>' + add + '</div></li>';
  }
  function dayHeadHTML(t, date, i) {
    var hol = C.holidayName(date), title = t.dayTitles[date] || '';
    var tt = canEdit()
      ? '<button type="button" class="day-t' + (title ? '' : ' empty') + '" data-act="day-title" data-date="' + date + '">' + esc(title || 'この日のひとこと（例：金沢 → 富山）') + '</button>'
      : '<span class="day-t">' + esc(title) + '</span>';
    return '<header class="day-h"><span class="day-n">' + (i + 1) + '日目</span><span class="day-d' + dayClass(date) + '">' + C.labelDate(date) + '</span>' +
      (hol ? '<span class="day-hol">' + hol + '</span>' : '') + tt +
      (canEdit() ? '<button type="button" class="icon-btn day-add" data-act="add" data-date="' + date + '" aria-label="' + C.labelDate(date) + 'に予定を追加" title="この日に予定を追加">' + ic('plus') + '</button>' : '') +
      '</header>';
  }
  function nextCardHTML(t) {
    if (phase(t).k !== 'during') return '';
    var n = now(), today = C.isoDate(n), nm = n.getHours() * 60 + n.getMinutes();
    var list = C.eventsOn(t, today).filter(function (e) { return !e.allDay && e.start; });
    var cur = null, nxt = null;
    list.forEach(function (e) {
      var s = C.toMin(e.start), en = C.endMin(e); if (en == null) en = s + 30;
      if (s <= nm && nm < en) cur = e;
      else if (s > nm && !nxt) nxt = e;
    });
    if (cur) {
      var left = C.endMin(cur) != null ? 'あと' + C.fmtDur(C.endMin(cur) - nm) + '（' + cur.end + ' まで）' : '';
      return '<button type="button" class="next" data-act="open" data-id="' + cur.id + '"><small>いまの予定</small><strong>' + esc(cur.title) + '</strong><span>' +
        esc([left, nxt ? '次は ' + nxt.start + ' ' + nxt.title : ''].filter(Boolean).join('　／　')) + '</span></button>';
    }
    if (nxt) return '<button type="button" class="next" data-act="open" data-id="' + nxt.id + '"><small>次の予定</small><strong><span class="num">' + nxt.start + '</span>　' + esc(nxt.title) + '</strong><span>あと' + C.fmtDur(C.toMin(nxt.start) - nm) + '</span></button>';
    var tm = C.eventsOn(t, C.addDays(today, 1)).filter(function (e) { return !e.allDay && e.start; })[0];
    if (tm && C.addDays(today, 1) <= t.endDate) return '<button type="button" class="next" data-act="open" data-id="' + tm.id + '"><small>きょうの予定は終わりました</small><strong>あしたは <span class="num">' + tm.start + '</span>　' + esc(tm.title) + '</strong></button>';
    return '';
  }
  function listHTML(t) {
    var days = C.tripDays(t), n = now(), today = C.isoDate(n), nowMin = n.getHours() * 60 + n.getMinutes();
    var h = '<div class="wrap">' + nextCardHTML(t);
    days.forEach(function (date, i) {
      var list = C.eventsOn(t, date);
      h += '<section class="day" data-date="' + date + '">' + dayHeadHTML(t, date, i);
      if (!list.length) {
        h += '<div class="empty-day"><span>この日の予定はまだありません</span>' + (canEdit() ? '<button type="button" class="btn small" data-act="add" data-date="' + date + '">' + ic('plus') + '予定を入れる</button>' : '') + '</div>';
      } else {
        h += '<ol class="tl">';
        list.forEach(function (ev, k) {
          if (k > 0) h += gapHTML(list[k - 1], ev, date);
          h += evHTML(ev, date === today ? nowMin : null, date < today);
        });
        h += '</ol>';
      }
      h += '</section>';
    });
    var out = t.events.filter(function (e) { return days.indexOf(e.date) < 0; });
    if (out.length) {
      h += '<section class="day"><header class="day-h"><span class="day-d">日程の外の予定</span><span class="day-t">' + out.length + '件。日にちを直すか、旅行の日付を広げてください</span></header><ol class="tl">' +
        C.sortEvents(out).map(function (ev) { return evHTML(ev, null, false); }).join('') + '</ol></section>';
    }
    if (canEdit()) h += '<div class="list-foot"><button type="button" class="btn small" data-act="add-day">' + ic('plus') + '1日ふやす</button><button type="button" class="btn small" data-act="trip-edit">' + ic('gear') + '旅行の名前・日付</button></div>';
    return h + '</div>';
  }

  // ---------- 時間割 ----------
  function gridHTML(t) {
    var days = C.tripDays(t), lo = 7, hi = 21, today = C.isoDate(now());
    t.events.forEach(function (ev) {
      var s = C.toMin(ev.start);
      if (ev.allDay || s == null || days.indexOf(ev.date) < 0) return;
      var e = C.endMin(ev); if (e == null) e = s + 30;
      lo = Math.min(lo, Math.floor(s / 60));
      hi = Math.max(hi, Math.ceil(Math.min(1440, e) / 60));
    });
    G.lo = lo; G.hi = hi; G.H = Math.round(56 * (D.prefs.zoom || 1));
    var rows = hi - lo, ppm = G.H / 60;
    var h = '<div class="grid-tools"><p>' + (canEdit() ? '予定をドラッグ（スマホは長押ししてから）で時間を動かせます。あいている所を押すと追加。' : '予定を押すと、くわしい情報が見られます。') + '</p>' +
      '<button type="button" class="icon-btn" data-act="zoom" data-d="-1" aria-label="表示を小さく" title="表示を小さく">' + ic('zout') + '</button>' +
      '<button type="button" class="icon-btn" data-act="zoom" data-d="1" aria-label="表示を大きく" title="表示を大きく">' + ic('zin') + '</button></div>';
    h += '<div class="grid" style="--n:' + days.length + ';--rows:' + rows + ';--hour:' + G.H + 'px">';
    h += '<div class="g-corner"></div>';
    days.forEach(function (date, i) {
      var hol = C.holidayName(date);
      h += '<div class="g-dayh' + dayClass(date) + (date === today ? ' today' : '') + '" data-date="' + date + '"><b>' + (i + 1) + '日目</b><span>' + C.shortDate(date) + '</span>' + (hol ? '<small>' + hol + '</small>' : '') + '</div>';
    });
    var loose = t.events.filter(function (e) { return (e.allDay || !e.start) && days.indexOf(e.date) >= 0; });
    if (loose.length) {
      h += '<div class="g-allc">終日<br>未定</div>';
      days.forEach(function (date) {
        h += '<div class="g-all">' + C.sortEvents(loose.filter(function (e) { return e.date === date; })).map(function (ev) {
          return '<button type="button" class="g-chip cat-' + ev.cat + '" data-act="open" data-id="' + ev.id + '">' + esc(ev.title) + '</button>';
        }).join('') + '</div>';
      });
    }
    h += '<div class="g-axis">';
    for (var hr = lo; hr <= hi; hr++) h += '<span class="num" style="top:' + ((hr - lo) * G.H) + 'px">' + (hr === lo ? '' : hr + ':00') + '</span>';
    h += '</div>';
    var n = now(), nm = n.getHours() * 60 + n.getMinutes();
    days.forEach(function (date) {
      h += '<div class="g-col" data-date="' + date + '">';
      C.layoutDay(C.eventsOn(t, date), 22 / ppm).forEach(function (it) {
        var ev = it.ev, top = (it.s - lo * 60) * ppm, height = Math.max(20, (it.e - it.s) * ppm - 2);
        var w = 100 / it.cols;
        h += '<button type="button" class="g-ev cat-' + ev.cat + (height < 36 ? ' short' : '') + (ev.tentative ? ' tent' : '') + (ev.warn ? ' warn' : '') + '" data-act="open" data-id="' + ev.id + '" ' +
          'style="--lines:' + Math.max(1, Math.floor((height - 22) / 16)) + ';top:' + top.toFixed(1) + 'px;height:' + height.toFixed(1) + 'px;left:calc(' + (it.col * w) + '% + 2px);width:calc(' + w + '% - 4px)">' +
          '<b>' + esc(ev.title) + '</b><span class="num">' + ev.start + (ev.end ? '–' + ev.end : '') + '</span>' +
          (height >= 30 ? '<i class="g-grip" aria-hidden="true"></i>' : '') + '</button>';
      });
      if (date === today && nm >= lo * 60 && nm <= hi * 60) h += '<div class="g-now" style="top:' + ((nm - lo * 60) * ppm) + 'px"></div>';
      h += '</div>';
    });
    return h + '</div>';
  }

  // ---------- まとめ ----------
  function rowHTML(ev, right, sub, cls) {
    return '<li><button type="button" class="row cat-' + ev.cat + (cls || '') + '" data-act="open" data-id="' + ev.id + '"><span class="dot">' + ic(evIcon(ev)) + '</span>' +
      '<span><span class="row-t">' + esc(ev.title) + '</span><span class="row-s">' + esc(sub) + '</span></span><span class="row-r">' + right + '</span></button></li>';
  }
  function whenShort(ev) { return C.shortDate(ev.date) + (ev.start ? ' ' + ev.start : ''); }
  function sumHTML(t) {
    var evs = orderedEvents(t), h = '<div class="wrap"><div class="sum">';
    // 旅のメモ
    h += '<section><h2>' + esc(t.title) + '<small>' + esc(rangeLabel(t) + '・' + C.nightsLabel(t)) + '</small></h2>' +
      (t.note ? '<p class="sum-note">' + linkify(t.note) + '</p>' : '<p class="muted">旅行のメモはまだありません。</p>') +
      (canEdit() ? '<div class="list-foot" style="padding-top:10px"><button type="button" class="btn small" data-act="trip-edit">' + ic('gear') + '旅行の名前・日付・メモ</button></div>' : '') + '</section>';
    // 準備リスト
    var done = t.todos.filter(function (x) { return x.done; }).length;
    h += '<section><h2>準備リスト<small>' + (t.todos.length ? done + ' / ' + t.todos.length + ' 済み' : '') + '</small></h2>';
    if (t.todos.length) {
      h += '<ul class="rows">' + t.todos.map(function (x) {
        return '<li class="todo-row"><label><input type="checkbox" data-change="todo" data-id="' + x.id + '"' + (x.done ? ' checked' : '') + (Host.canEdit ? '' : ' disabled') + '><span>' + esc(x.text) + '</span></label>' +
          (canEdit() ? '<button type="button" class="icon-btn" data-act="todo-del" data-id="' + x.id + '" aria-label="「' + esc(x.text) + '」を消す">' + ic('x') + '</button>' : '<span></span>') + '</li>';
      }).join('') + '</ul>';
    } else h += '<p class="muted">予約や持ち物など、出発までにやることを書いておけます。</p>';
    if (canEdit()) h += '<form class="todo-add" id="todo-form"><input type="text" id="todo-text" placeholder="やること・持ち物を追加" autocomplete="off" aria-label="準備リストに追加"><button type="submit" class="btn">追加</button></form>';
    h += '</section>';
    // 要確認
    var warns = evs.filter(function (e) { return e.warn || e.tentative; });
    h += '<section><h2>要確認・仮の予定<small>' + warns.length + '件</small></h2>';
    h += warns.length ? '<ul class="rows">' + warns.map(function (e) {
      return rowHTML(e, whenShort(e), e.warn ? e.warn.split('\n')[0] : '時刻・内容が仮のままです', e.warn ? ' warn-row' : '');
    }).join('') + '</ul>' : '<p class="muted">気になる点のある予定はありません。</p>';
    h += '</section>';
    // 予約
    var res = evs.filter(function (e) { return e.reserve; });
    var todo = res.filter(function (e) { return e.reserve === 'todo'; }).length;
    h += '<section><h2>予約<small>' + (res.length ? 'これから ' + todo + '件・済み ' + (res.length - todo) + '件' : '') + '</small></h2>';
    h += res.length ? '<ul class="rows">' + res.map(function (e) {
      return rowHTML(e, e.reserve === 'done' ? '<span class="tag done">' + ic('check') + '予約済み</span>' : '<span class="tag">未予約</span>', whenShort(e) + (e.reserveNo ? '・' + e.reserveNo : (e.line ? '・' + e.line : '')));
    }).join('') + '</ul>' : '<p class="muted">予約が必要な予定に「これから予約」と付けると、ここに並びます。</p>';
    h += '</section>';
    // 宿
    var stays = evs.filter(function (e) { return e.cat === 'stay'; });
    if (stays.length) {
      h += '<section><h2>宿</h2><ul class="rows">' + stays.map(function (e) {
        var p = e.places[0] || {};
        return rowHTML(e, C.shortDate(e.date), [p.name, p.tel].filter(Boolean).join('・') || '場所が未入力です');
      }).join('') + '</ul></section>';
    }
    // 費用
    var total = C.totalCost(t), paid = evs.filter(function (e) { return e.cost !== ''; });
    h += '<section><h2>費用<small>入力した分の合計</small></h2>';
    if (paid.length) {
      var by = {};
      paid.forEach(function (e) { by[e.cat] = (by[e.cat] || 0) + (+e.cost); });
      h += '<div class="big">' + C.yen(total) + '</div><div class="cost-bar">' + C.CAT_ORDER.filter(function (k) { return by[k]; }).map(function (k) {
        return '<i class="cat-' + k + '" style="flex:' + by[k] + '"></i>';
      }).join('') + '</div><div class="cost-leg">' + C.CAT_ORDER.filter(function (k) { return by[k]; }).map(function (k) {
        return '<span class="cat-' + k + '">' + C.CATS[k].label + ' ' + C.yen(by[k]) + '</span>';
      }).join('') + '</div><ul class="rows" style="margin-top:10px">' + paid.map(function (e) { return rowHTML(e, '<span class="num">' + C.yen(e.cost) + '</span>', whenShort(e)); }).join('') + '</ul>';
    } else h += '<p class="muted">まだ金額が入っていません。予定の編集で「費用」を入れると、ここに合計が出ます。</p>';
    h += '</section>';
    return h + '</div></div>';
  }

  // ---------- 日チップの現在位置 ----------
  function spy() {
    var chips = $$('#chips .chip');
    if (!chips.length) return;
    var cur = '';
    // 日チップを押した直後は、スクロールの途中経過で上書きしない
    if (UI.day && Date.now() < (UI.jumpLock || 0)) cur = UI.day;
    else if (UI.tab === 'list') {
      var top = mainEl.scrollTop + 60;
      $$('.day[data-date]', mainEl).forEach(function (s) { if (s.offsetTop <= top) cur = s.dataset.date; });
      if (!cur && chips[0]) cur = chips[0].dataset.date;
    } else if (UI.tab === 'grid') {
      var left = mainEl.scrollLeft + 44 + 20;
      $$('.g-col', mainEl).forEach(function (c) { if (c.offsetLeft <= left) cur = c.dataset.date; });
    }
    UI.day = cur;
    chips.forEach(function (c) {
      var on = c.dataset.date === cur;
      if (on && c.getAttribute('aria-current') !== 'true') {
        var box = $('#chips'), l = c.offsetLeft - box.offsetLeft;
        if (l < box.scrollLeft || l + c.offsetWidth > box.scrollLeft + box.clientWidth) box.scrollLeft = Math.max(0, l - 16);
      }
      c.setAttribute('aria-current', on ? 'true' : 'false');
    });
  }

  // ---------- シート ----------

  function openSheet(s) { UI.sheets.push(s); drawSheet(true); }

  }
  function drawSheet(focus) {
    var s = UI.sheets[UI.sheets.length - 1];
    if (!s) { sheetEl.hidden = true; scrimEl.hidden = true; sheetEl.innerHTML = ''; return; }
    if (s.type === 'detail' && !findEv(s.id)) { UI.sheets.pop(); return drawSheet(focus); }
    var keep = !focus && $('.sheet-body', sheetEl) ? $('.sheet-body', sheetEl).scrollTop : 0;
    sheetEl.className = 'sheet' + (TALL[s.type] ? ' tall' : '');
    sheetEl.innerHTML = SHEETS[s.type](s);
    sheetEl.hidden = false; scrimEl.hidden = false;
    var body = $('.sheet-body', sheetEl);
    if (body) body.scrollTop = keep;
    if (focus) {
      var af = $('[data-autofocus]', sheetEl);
      if (af && !('ontouchstart' in window)) af.focus(); else sheetEl.focus();
    }
    if (s.type === 'form') initForm();
  }

  function mapUrl(p) {
    var q = [p.name.replace(/[（(].*?[）)]/g, ' '), p.address.replace(/^〒\s*[\d-]+\s*/, '')].filter(function (x) { return x.trim(); }).join(' ');
    return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q.trim());
  }
  function routeLink(ev) {
    if (!ev.from || !ev.to || ev.cat !== 'move') return '';
    if (ev.mode === 'car' || ev.mode === 'walk') {
      return '<a class="btn small" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&origin=' + encodeURIComponent(ev.from) + '&destination=' + encodeURIComponent(ev.to) + '&travelmode=' + (ev.mode === 'car' ? 'driving' : 'walking') + '">' + ic('map') + '道順を地図で見る</a>';
    }
    if (ev.mode === 'plane') return '';
    var d = ev.date.split('-'), t = ev.start || '';
    var u = 'https://transit.yahoo.co.jp/search/result?from=' + encodeURIComponent(ev.from) + '&to=' + encodeURIComponent(ev.to) + '&y=' + d[0] + '&m=' + d[1] + '&d=' + d[2] +
      (t ? '&hh=' + t.slice(0, 2) + '&m1=' + t.charAt(3) + '&m2=' + t.charAt(4) : '') + '&type=1';
    return '<a class="btn small" target="_blank" rel="noopener" href="' + esc(u) + '">' + ic('route') + '乗換案内でしらべる</a>';
  }
  function placeHTML(p, i, n) {
    var url = safeUrl(p.url), tel = p.tel.replace(/[^\d+]/g, '');
    var h = '<div class="place"><h4>' + (n > 1 ? '<small>候補' + (i + 1) + '</small>' : '') + '<span>' + esc(p.name || '場所') + '</span></h4>';
    if (p.address) h += '<div class="kv">' + ic('pin') + '<div>' + esc(p.address) + '</div></div>';
    if (p.tel) h += '<div class="kv">' + ic('phone') + '<div class="num">' + esc(p.tel) + '</div></div>';
    if (p.hours) h += '<div class="kv">' + ic('clock') + '<div>' + esc(p.hours) + '</div></div>';
    if (p.note) h += '<div class="kv">' + ic('note') + '<div>' + linkify(p.note) + '</div></div>';
    h += '<div class="acts">';
    if (p.name || p.address) h += '<a class="btn small" target="_blank" rel="noopener" href="' + esc(mapUrl(p)) + '">' + ic('map') + '地図をひらく</a>';
    if (tel) h += '<a class="btn small" href="tel:' + tel + '">' + ic('phone') + '電話する</a>';
    if (url) h += '<a class="btn small" target="_blank" rel="noopener" href="' + esc(url) + '">' + ic('link') + 'サイトを見る</a>';
    if (p.address) h += '<button type="button" class="btn small" data-act="copy" data-text="' + esc(p.address.replace(/^〒\s*[\d-]+\s*/, '')) + '" data-what="住所">' + ic('copy') + '住所をコピー</button>';
    if (tel) h += '<button type="button" class="btn small" data-act="copy" data-text="' + esc(p.tel) + '" data-what="電話番号">' + ic('copy') + '番号をコピー</button>';
    return h + '</div></div>';
  }
  var SHEETS = {};
  SHEETS.detail = function (s) {
    var ev = findEv(s.id), t = trip(), all = orderedEvents(t), idx = all.indexOf(ev);
    var days = C.tripDays(t), di = days.indexOf(ev.date), dur = C.duration(ev);
    var nav = '<button type="button" class="icon-btn" data-act="open-rel" data-id="' + (idx > 0 ? all[idx - 1].id : '') + '" aria-label="前の予定"' + (idx > 0 ? '' : ' disabled') + '>' + ic('left') + '</button>' +
      '<button type="button" class="icon-btn" data-act="open-rel" data-id="' + (idx < all.length - 1 ? all[idx + 1].id : '') + '" aria-label="次の予定"' + (idx < all.length - 1 ? '' : ' disabled') + '>' + ic('right') + '</button>';
    var h = '<div class="sheet-head cat-' + ev.cat + '"><span class="d-cat" style="flex:1"><span class="dot">' + ic(evIcon(ev)) + '</span>' + esc(catLabel(ev)) + '</span>' + nav +

      '<span>' + C.labelDate(ev.date) + (di >= 0 ? '・' + (di + 1) + '日目' : '') + (dur ? '・' + C.fmtDur(dur) : '') + '</span>' +

    if (ev.warn) h += '<div class="d-warn">' + ic('warn') + '<div>' + linkify(ev.warn) + '</div></div>';
    if (ev.from || ev.to || ev.line || ev.seat) {
      h += '<section class="d-sec"><h3>区間</h3>';
      if (ev.from || ev.to) {
        h += '<div class="route"><div class="route-p"><i></i><b>' + esc(ev.from || '？') + '</b><span class="num">' + esc(ev.start) + '</span></div>' +
          '<div class="route-p"><i></i><b>' + esc(ev.to || '？') + '</b><span class="num">' + esc(ev.end) + '</span></div></div>';
      }
      if (ev.line) h += '<div class="kv">' + ic(evIcon(ev)) + '<div>' + esc(ev.line) + '</div></div>';

        (canEdit() && ev.reserve === 'done' ? '<button type="button" class="btn small" data-act="reserve" data-id="' + ev.id + '" data-v="todo">未予約に戻す</button>' : '') +

  };
  SHEETS.shift = function (s) {

      if (el.dataset && el.dataset.change === 'todo') {
        var id = el.dataset.id, on = el.checked;
        commit(null, function () { var x = trip().todos.filter(function (y) { return y.id === id; })[0]; if (x) x.done = on; });
      } else if (el.id === 'import-file' && el.files && el.files[0]) {
        var fr = new FileReader();
        fr.onload = function () {
          try {
            var o = JSON.parse(fr.result), list = Array.isArray(o.trips) ? o.trips : (o.events ? [o] : []);
            if (!list.length) throw new Error('empty');
            UI.sheets = []; drawSheet(false);
            list.forEach(function (raw) { takeShared(raw, '読み込んだ'); });
          } catch (err) { toast('このファイルは読み込めませんでした（たびしおりのバックアップではないようです）'); }
        };
        fr.readAsText(el.files[0]);
      }
    });
    mainEl.addEventListener('scroll', function () { if (!spy.t) spy.t = setTimeout(function () { spy.t = 0; spy(); }, 80); }, { passive: true });
    mainEl.addEventListener('pointerdown', onPointerDown);
    window.addEventListener('pointermove', onPointerMove, { passive: false });
    window.addEventListener('pointerup', function (e) { if (drag && e.pointerId === drag.pid) dragEnd(true); });
    window.addEventListener('pointercancel', function (e) { if (drag && e.pointerId === drag.pid) dragEnd(false); });
    // 長押しでつかんだあとは、画面のスクロールを止める
    mainEl.addEventListener('touchmove', function (e) { if (drag && drag.active) e.preventDefault(); }, { passive: false });
    mainEl.addEventListener('contextmenu', function (e) { if (drag || (e.target.closest && e.target.closest('.g-ev') && canEdit() && 'ontouchstart' in window)) e.preventDefault(); });
    doc.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { if (drag) return dragEnd(false); if (UI.sheets.length) { e.preventDefault(); closeSheet(); } return; }
      var typing = /^(INPUT|TEXTAREA|SELECT)$/.test((e.target.tagName || ''));
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z' && !typing && canEdit()) { e.preventDefault(); if (e.shiftKey) redo(); else undo(); }
    });
    window.addEventListener('pagehide', stashUI);
    // スマホでキーボードが出たとき、入力フォームがキーボードの下に隠れないようにする
    var vv = window.visualViewport;
    if (vv) {
      var fit = function () {
        var hidden = window.innerHeight - (vv.offsetTop + vv.height);
        if (Math.abs(vv.scale - 1) < 0.01 && hidden > 80 && window.innerWidth < 900) { sheetEl.style.bottom = Math.round(hidden) + 'px'; sheetEl.style.maxHeight = Math.round(vv.height - 12) + 'px'; }
        else { sheetEl.style.bottom = ''; sheetEl.style.maxHeight = ''; }
      };
      vv.addEventListener('resize', fit);
      vv.addEventListener('scroll', fit);
    }
    setInterval(function () { if (!UI.sheets.length && !drag && trip() && phase(trip()).k === 'during' && UI.tab !== 'sum') renderMain(); }, 60000);
  }

  // ---------- 起動 ----------
  function connectHost() {
    if (!Host.artifact) return;
    var c = window.claude;
    Promise.all([c.use('artifact'), c.use('user'), c.use('downloads')]).then(function (r) {
      Host.api = r[0]; Host.downloads = r[2];
      return r[0] && r[1] ? r[1].canEdit() : false;
    }).then(function (ok) {
      if (!ok) return;
      Host.canEdit = true;
      applyDraft();
      persist();
      render();
    }, function () { /* 見るだけのまま */ });
  }
  function boot() {
    buildShell();
    load();
    bind();
    render();
    readHash();
    connectHost();
    window.addEventListener('hashchange', readHash);
  }
  // テスト用の入口（画面からは使わない）
  window.TabiApp = { state: function () { return { D: D, UI: UI, Host: Host, G: G }; }, render: function () { render(); }, buildDocument: buildDocument, getSources: getSources, encodeShare: encodeShare };
  if (doc.readyState === 'loading') doc.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>
